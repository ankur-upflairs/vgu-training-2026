<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .header{
            display: flex;
            justify-content: space-between;
            background-color: #0B0A0F;
            border-radius: 10px;
            width: 90%;
            margin: 10px auto;
            padding-left: 20px;
            padding-right: 20px;
        }
        .logo{
            color: white;
            font-size: 24px;
            padding-top: 10px;
        }
        .links ul{
            display: flex;
            gap: 20px;
            list-style: none;
        }
        .links li a{
            color: white;
            text-decoration: none;
        }
        .links button{
            border: none;
            border-radius: 6px;
            padding: 4px 6px;
            background-color: #D8ED70;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">Logo</div>
        <div class="links">
            <ul>
                <li><a href="#">about us</a></li>
                <li><a href="#">portfolio</a></li>
                <li><a href="#">services</a></li>
                <li><a href="#"><button>contact us</button></a></li>

            </ul>
        </div>
    </div>
</body>
</html>
