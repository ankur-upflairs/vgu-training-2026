<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css" >
    <style>
        /* element selector  */
        h1{
            font-size: 50px;color: tan;
        }
        /* use dot . before class name */
        /* class can be multiple places/ elements */
        .a{
            color: red;
        }
        /* use # before id name  */
        /* id must be unique for every element */
        #x{
            background-color: yellow;
        }
    </style>
</head>
<body>
    <!-- inline css -->
     <p style="color: red;background-color: blue;">Lorem ipsum dolor sit.</p>
     <!-- internal css  -->
    <h1>internal css - element selector</h1>
    <h2 class="a" >class selector</h2>
    <h2 id="x">id selector</h2>
    <p class="para">this is an example of external css</p>
    <p id="para1">this is sample paragraph</p>
</body>
</html>
