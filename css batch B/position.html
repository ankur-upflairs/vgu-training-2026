<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1{
            width: 100px;height: 100px;border: 1px solid;background-color: blue;
            position: absolute;
            top: 50px;left: 50px;
            /* right: 50%;bottom: 50%; */
            z-index: 5;
        }
        .box2{
            width: 100px;height: 100px;border: 1px solid;background-color: yellow;
            position: relative;
            /* right: 50px; top: 50px; */left: 50px; top: 150px;
            z-index: 1;
        }.box3{
            width: 100px;height: 100px;border: 1px solid;background-color: green;
            position: fixed;
            right: 10px;bottom: 10px;
        }.box4{
            width: 100px;height: 100px;border: 1px solid;background-color: red;
            position: sticky;
            top: 20px;    
            z-index: 3;   
        }
    </style>
</head>
<body>
    <div class="box1">absolute</div>
    <div class="box2">relative</div>
    <div class="box3">fixed</div>
    <div class="box4">sticky</div>
    <p style="height: 1000px;"></p>

</body>
</html>
