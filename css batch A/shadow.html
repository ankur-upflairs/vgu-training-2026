<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      p {
        font-size: 50px;
        text-shadow:
          3px 3px 4px red,
          5px 5px 4px green;
      }
      .box {
        width: 100px;
        height: 100px;
        border: 1px solid;
        margin: 0 auto;
        /* box-shadow:5px 5px 5px 0px blue , 7px 7px 5px red; */
        box-shadow:
          5px 5px 5px 0px darkgray,
          -5px -5px 5px darkgray;
      }
    </style>
  </head>
  <body>
    <p>TEXT</p>
    <div class="box"></div>
  </body>
</html>
