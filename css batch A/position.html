<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1{width: 100px;height: 100px;border: 1px solid;
        background-color: red;
        position: absolute;
        bottom: 10px;
        right: 10px;
        }
        .box2{width: 100px;height: 100px;border: 1px solid;
        background-color: yellow;
        position: relative;
        top: 50px;right: 50px;
        z-index: 2;
        }
         .box3{width: 100px;height: 100px;border: 1px solid;
        background-color: green;
        position: fixed;
        /* bottom: 10px;left: 10px;     */
        z-index: 12;
        }
         .box4{width: 100px;height: 100px;border: 1px solid;
        background-color: blue;
        position: sticky;
        top: 30px;   
        z-index: 10;
        }
    </style>
</head>
<body>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
    <div class="box4"></div>
    <p style="height: 1000px;"></p>


</body>
</html>
