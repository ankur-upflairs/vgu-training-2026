<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        /* element selector  */
        h1{
            color: blue;background-color: gray;
        }
        .a{
            font-size: 30px;
            color: aqua;
        }
        #a{
            color: tan;
            background-color: red;
        }
    </style>
</head>
<body>
    <!-- this is an example of inline css -->
    <p style="color: red;background-color: tan;">this is a paragraph</p>
    <!-- this is an example of internal css -->
    <h1>heading</h1>
    <p class="a" >this is example of class selector</p>
    <p id="a" >example of id selector</p>
</body>
</html>
